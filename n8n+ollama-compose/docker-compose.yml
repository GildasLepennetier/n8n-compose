services:

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    pull_policy: always
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: <YOUR_DOMAIN>
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      N8N_EDITOR_BASE_URL: https://<YOUR_DOMAIN>
      WEBHOOK_URL: https://<YOUR_DOMAIN>
      GENERIC_TIMEZONE: Europe/Berlin
      TZ: Europe/Berlin
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - ai_network

  ollama:
    image: ollama/ollama:latest
    pull_policy: always
    container_name: ollama
    # no ports exposed — only accessible via Docker network (http://ollama:11434)
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - ai_network

volumes:
  n8n_data:
  ollama_data:

networks:
  ai_network:
    driver: bridge
